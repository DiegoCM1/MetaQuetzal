name: Backend Tests

on:
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      FIREBASE_PROJECT_ID: test-project
      FIREBASE_CLIENT_EMAIL: test@test-project.iam.gserviceaccount.com
      FIREBASE_PRIVATE_KEY: fake-key
      NOTIF_API_KEY: s3cret-xyz
      OPENWEATHER_API_KEY: test-key
      LLM_API_KEY: test-key
      LLM_BASE_URL: https://example.com
      LLM_MODEL: test-model

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Read from backend/.python-version so CI, local venvs and Railway
          # cannot drift apart. Railway already builds against that file, so
          # this keeps tests on the exact interpreter production runs.
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest
